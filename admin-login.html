<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Cosmic Gifts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cosmic-black: #0a0a0a;
            --deep-space: #1a1a2e;
            --cosmic-blue: #4da6ff;
            --star-white: #ffffff;
            --moon-gray: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--cosmic-black);
            color: var(--star-white);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: var(--deep-space);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(77, 166, 255, 0.2);
            border: 2px solid rgba(77, 166, 255, 0.3);
        }

        .login-container h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #4da6ff, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 1rem;
            background: rgba(10, 10, 20, 0.8);
            border: 2px solid rgba(77, 166, 255, 0.3);
            border-radius: 10px;
            color: var(--star-white);
            font-size: 1.1rem;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--cosmic-blue);
            box-shadow: 0 0 15px rgba(77, 166, 255, 0.4);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #4da6ff, #9d4edd);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            box-shadow: 0 8px 30px rgba(77, 166, 255, 0.4);
        }

        button:hover {
            box-shadow: 0 15px 40px rgba(77, 166, 255, 0.6);
        }

        .back-link {
            margin-top: 2rem;
            display: block;
            color: var(--moon-gray);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--star-white);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Admin Login</h2>
        <form action="admin-page.html" method="POST">
            <div class="form-group">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const passwordInput = document.querySelector('input[name="password"]');
        const password = passwordInput.value;

        // CHANGE THIS TO YOUR DESIRED PASSWORD
        const correctPassword = "Ts-wont-work";

        if (password !== correctPassword) {
            e.preventDefault(); // Stop form from submitting
            alert("*Invalid Password*"); // Or show error message on page
            passwordInput.style.borderColor = "#ff4444"; // optional red border
        }
        // If correct → form submits normally to admin.php
    });
</script>
        <a href="index.html" class="back-link">← Back to Site</a>
    </div>
</body>
</html>
